<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#121c15" />
    <meta name="robots" content="noindex" />
    <title>Quinta da Libélula — a concept</title>
    <meta name="description" content="A concept demonstration for a new Quinta da Libélula website. Not the official site." />
    <link rel="icon" href="./images/Logo_QLL-Fav_2.png" />
    <script>
      // Start the intro's 3D dragonfly downloading before the app boots, but only for
      // visitors who will see it (mirrors src/intro/introChoice.ts and lowPower()).
      (function () {
        try {
          var q = new URLSearchParams(location.search), intro = q.get('intro');
          if (q.has('skip') || location.hash.length > 1 || intro === 'film' || intro === 'still') return;
          if (intro !== 'canvas') {
            if (sessionStorage.getItem('qdl-intro-seen') === '1') return;
            if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
          }
          var n = navigator, c = n.connection;
          if ((n.deviceMemory !== undefined && n.deviceMemory <= 2) || (c && c.saveData)) return;
          ['./models/dragonfly-original.glb', './draco/draco_decoder.wasm'].forEach(function (href) {
            var l = document.createElement('link');
            l.rel = 'preload';
            l.as = 'fetch';
            l.crossOrigin = 'anonymous';
            l.href = href;
            document.head.appendChild(l);
          });
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..600,50..100;1,9..144,300..500,50..100&family=Manrope:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
